# Nombre fijo del proyecto Docker (el volumen de datos queda como agroasesor_hugo_agroasesor_data).
name: agroasesor_hugo

services:
  agroasesor:
    build: .
    image: agroasesor_hugo
    container_name: agroasesor_hugo
    ports:
      - "8000:8000"
    environment:
      # Se pueden sobrescribir creando un archivo .env junto a este (ver .env.example).
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cambia-esta-clave-solo-para-desarrollo}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_DB_PATH: /data/db.sqlite3
      DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL en el archivo .env}
      DJANGO_BACKUP_DIR: /backups
      # Correo (recuperar contraseña). Los valores reales van en .env; sin .env sale por la consola.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-AgroAsesor <noreply@localhost>}
    volumes:
      - agroasesor_data:/data   # LA base de datos oficial (SQLite persistente)
      - ./backups:/backups      # respaldos automáticos (visibles en tu PC)
    restart: unless-stopped

volumes:
  agroasesor_data: