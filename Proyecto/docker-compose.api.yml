services:
  agroasesor:
    environment:
      AGROASESOR_API_URL: http://api:5050
      AGROASESOR_INTERNAL_SECRET: ${AGROASESOR_INTERNAL_SECRET:?Define AGROASESOR_INTERNAL_SECRET en .env}
    depends_on:
      - api

  api:
    build: ./backend_flask
    image: agroasesor_api
    container_name: agroasesor_api
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "5050"
      AGROASESOR_READONLY_DATABASE_URL: ${AGROASESOR_READONLY_DATABASE_URL:?Define AGROASESOR_READONLY_DATABASE_URL en .env}
      AGROASESOR_INTERNAL_SECRET: ${AGROASESOR_INTERNAL_SECRET:?Define AGROASESOR_INTERNAL_SECRET en .env}
    expose:
      - "5050"
    restart: unless-stopped
